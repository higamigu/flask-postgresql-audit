# Tox (https://tox.wiki/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist = {py311,py312,py313}-{schemaDefault,schemaAudit}

[testenv]
commands =
    pytest tests {posargs}
deps =
    -r requirements.test
passenv =
    POSTGRES_USER
    POSTGRES_PASSWORD
    POSTGRES_DB
    POSTGRES_PORT
setenv =
    SQLALCHEMY_WARN_20=1
    # Uses $POSTGRES_PORT from host OS if set; falls back to 5492 if unset/empty
    # POSTGRES_PORT = {env:POSTGRES_PORT:5492}
    schemaDefault: SCHEMA_NAME=
    schemaAudit: SCHEMA_NAME=audit
