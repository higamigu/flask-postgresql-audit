name: Test

on:
  - push
  - pull_request

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.postgresql-version }}
        env:
          POSTGRES_DB: postgresql_audit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Python 3.15 / psycopg3 / PostgreSQL 18"
            python: "3.15"
            postgresql-version: 18
            tox: py315-schemaDefault-psycopg

          - name: "Python 3.15 / psycopg2 / PostgreSQL 18"
            python: "3.15"
            postgresql-version: 18
            tox: py315-schemaDefault-psycopg2

          - name: "Python 3.14 / psycopg3 / PostgreSQL 18"
            python: "3.14"
            postgresql-version: 18
            tox: py314-schemaDefault-psycopg

          - name: "Python 3.13 / psycopg3 / PostgreSQL 17"
            python: "3.13"
            postgresql-version: 17
            tox: py313-schemaDefault-psycopg

          - name: "Python 3.12 / psycopg3 / PostgreSQL 16"
            python: "3.12"
            postgresql-version: 16
            tox: py312-schemaDefault-psycopg

          - name: "Python 3.11 / psycopg3 / PostgreSQL 15"
            python: "3.11"
            postgresql-version: 15
            tox: py311-schemaDefault-psycopg

          - name: "Python 3.11 / psycopg2 / PostgreSQL 15"
            python: "3.11"
            postgresql-version: 15
            tox: py311-schemaDefault-psycopg2

    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade tox setuptools

      - name: Run tests
        env:
          POSTGRES_DB: postgresql_audit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5432
        run: tox -e ${{ matrix.tox }}
